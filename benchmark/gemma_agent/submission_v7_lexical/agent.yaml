name: cck_coder_v7_lexical
model: gemma-4-31b-it-qat-w4a16-ct
description: Root coding agent. Localizes the fix with lexical-first search, applies minimal edits with edit_file, runs a targeted test, then submits a non-empty patch.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
skills:
  - skills/repo_navigation
generate_content_config: !include configs/sampling.yaml
